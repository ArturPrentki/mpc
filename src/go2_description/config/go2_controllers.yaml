controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    
    whole_body_controller:
      type: whole_body_controller/WBC
      
    state_estimator:
      type: quadruped_estimators/ContactInEKFEstimator
      # type: quadruped_estimators/CheaterEstimator
    
    stand_up:
      type: stand_up_pkg/DownThenStand

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"


whole_body_controller:
  ros__parameters:
    dependencies: ["state_estimator"]

    # --- robot (everything else comes from the URDF) ---
    base_frame: "base"
    # Also the joint order of MpcTrajectory / RobotState messages
    joint_names: [
      FL_hip_joint, FL_thigh_joint, FL_calf_joint,
      FR_hip_joint, FR_thigh_joint, FR_calf_joint,
      RL_hip_joint, RL_thigh_joint, RL_calf_joint,
      RR_hip_joint, RR_thigh_joint, RR_calf_joint
    ]
    foot_frames: [FL_foot, FR_foot, RL_foot, RR_foot]
    nominal_joint_positions: [
      0.0, 0.8, -1.5,
      0.0, 0.8, -1.5,
      0.0, 0.8, -1.5,
      0.0, 0.8, -1.5
    ]
    nominal_height: 0.0   # from forward kinematics

    # Unitree drives run the joint PD (Mujoco / real robot).
    # For Gazebo (effort only) use: ["effort"]
    command_interfaces: [effort, position, velocity, proportional, derivative]
    estimator_name: "state_estimator"

    joint_gains:
      kp_stance: 0.0
      kd_stance: 1.0
      kp_swing: 20.0
      kd_swing: 1.0

    safety:
      damping_kd: 2.0

      
stand_up:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    target_stand:
      - -0.0
      - 0.8
      - -1.5
      - 0.0
      - 0.8
      - -1.5
      - -0.0
      - 1.0
      - -1.5
      - 0.0
      - 1.0
      - -1.5
    target_down:
      - -0.01
      - 1.27
      - -2.8
      - 0.01
      - 1.27
      - -2.8
      - -0.3
      - 1.31
      - -2.8
      - 0.3
      - 1.31
      - -2.8
    kp: 50.0   # Increased from 60
    kd: 2.50     # Adjusted for the new Kp
    duration: 2.0

state_estimator:
  ros__parameters:
    # --- IMU input -----------------------------------------------------------
    # "interface": imu_sensor/* state interfaces (MuJoCo / Unitree IMU)
    # "topic":     sensor_msgs/Imu, e.g. the MicroStrain driver
    imu_source: "interface"
    # imu_topic: "/imu/data_raw"      # scaled gyro + accel, orientation not used
    imu_timeout: 0.2                # [s] hold the estimate if the IMU is silent
    imu_max_dt: 0.05                # [s] larger IMU stamp gaps use the loop period

    # --- initialisation at activation ------------------------------------------
    # true : average imu_calibration_samples samples with the robot standing
    #        still: gyro bias + gravity direction (use for the real IMU)
    # false: use one sample for roll/pitch, gyro bias starts at 0 (simulation)
    imu_calibrate_on_start: false
    imu_calibration_samples: 500    # 1 s at 500 Hz

    # true : base starts at x = y = 0 with the feet in contact at z = 0
    # false: IMU starts at z = initial_height
    auto_initial_pose: true
    initial_height: 0.095

    base_frame: "base"
    imu_frame: "imu_link"

    # --- InEKF noise (tune!) -----------------------------------------------------
    noise_gyro: 0.01
    noise_accel: 0.1
    noise_gyro_bias: 0.00001
    noise_accel_bias: 0.0001
    noise_contact: 0.01
    noise_kinematics: 0.01
