controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    state_estimator:
      type: quadruped_estimators/CheaterEstimator
    
    stand_up:
      type: stand_up_pkg/StandUp

    whole_body_controller:
      type: whole_body_controller/WBC

stand_up:
  ros__parameters:
    joints:
      - LF_HAA
      - LF_HFE
      - LF_KFE
      - LH_HAA
      - LH_HFE
      - LH_KFE
      - RF_HAA
      - RF_HFE
      - RF_KFE
      - RH_HAA
      - RH_HFE
      - RH_KFE
    target:
      - 0.0
      - 0.7
      - -1.4
      - 0.0
      - 0.7
      - -1.4
      - 0.0
      - 0.7
      - -1.4
      - 0.0
      - 0.7
      - -1.4
    kp: 250.
    kd: 20.
    duration: 5.

whole_body_controller:
  ros__parameters:
    dependencies: ["state_estimator"]

    # --- robot (everything else comes from the URDF) ---
    base_frame: "TORSO"
    # Also the joint order of MpcTrajectory / RobotState messages.
    # Note: Pinocchio orders Gardo's joints LF, LH, RF, RH; the WBC maps it.
    joint_names: [
      LF_HAA, LF_HFE, LF_KFE,
      RF_HAA, RF_HFE, RF_KFE,
      LH_HAA, LH_HFE, LH_KFE,
      RH_HAA, RH_HFE, RH_KFE
    ]
    # fl, fr, rl, rr (FootContactFlags order)
    foot_frames: [LF_FOOT, RF_FOOT, LH_FOOT, RH_FOOT]
    nominal_joint_positions: [
      0.0, 0.7, -1.4,
      0.0, 0.7, -1.4,
      0.0, 0.7, -1.4,
      0.0, 0.7, -1.4
    ]
    nominal_height: 0.0   # from forward kinematics (~0.434 m)

    # Gazebo exposes effort only: the joint PD runs inside the WBC.
    command_interfaces: [effort]
    estimator_name: "state_estimator"

    joint_gains:
      kp_stance: 0.0
      kd_stance: 2.0
      kp_swing: 60.0
      kd_swing: 2.0

    safety:
      damping_kd: 5.0

    # --- locomotion (built-in MPC); velocity commands on /vel_cmd ---
    mpc:
      enabled: true
      rate: 50.0
    gait:
      cycle_time: 0.5
      duty_factor: 0.5
      phase_offsets: [0.0, 0.5, 0.5, 0.0]   # trot: LF+RH, then RF+LH
      step_height: 0.10
    foothold:
      max_offset: 0.18
    command:
      max_vx: 0.6
      max_vy: 0.3
      max_wz: 1.0
      timeout: 0.0   # set e.g. 0.5 on hardware with a continuous teleop
